appId: com.agentcrew.panel
productName: AgentCrew
copyright: AgentCrew
electronVersion: 33.4.11
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
  - node_modules/@agentcrew/dock-windows/**/*
  - node_modules/@agentcrew/dock-macos/**/*
  - node_modules/@agentcrew/dock-linux/**/*
  - node_modules/koffi/**/*
asar: false
extraResources:
  - from: ../../voces
    to: voces
    filter:
      - '**/*.mp3'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AgentCrew
portable:
  artifactName: ${productName}-${version}-portable.${ext}
